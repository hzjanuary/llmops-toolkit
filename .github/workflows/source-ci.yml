name: Source CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Fetch locked build dependencies (no inference)
        run: |
          cargo fetch --locked
      - name: Offline source and full flow gates
        run: python3 scripts/verify.py --output "$RUNNER_TEMP/offline-evidence"
      - name: Preserve SHA-bound source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/offline-evidence
          retention-days: 30
          if-no-files-found: error
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show active-toolchain
      - name: Install pinned security tools
        run: python3 scripts/install_security_tools.py "$RUNNER_TEMP/security-tools"
      - name: Complete-history and source secret gates
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          mkdir "$RUNNER_TEMP/security-evidence"
          "$RUNNER_TEMP/security-tools/gitleaks" git . --log-opts='--all --full-history' --redact --no-banner --report-format json --report-path "$RUNNER_TEMP/security-evidence/history.json"
          "$RUNNER_TEMP/security-tools/gitleaks" dir . --redact --no-banner --report-format json --report-path "$RUNNER_TEMP/security-evidence/tree.json"
      - name: Dependency vulnerability and unsoundness gates (retained root crate)
        run: |
          "$RUNNER_TEMP/security-tools/bin/cargo-audit" audit --deny unsound --file Cargo.lock --json > "$RUNNER_TEMP/security-evidence/root-audit.json"
          git rev-parse HEAD > "$RUNNER_TEMP/security-evidence/source-sha.txt"
          sha256sum "$RUNNER_TEMP/security-evidence/"*.json > "$RUNNER_TEMP/security-evidence/SHA256SUMS"
      - name: Preserve redacted security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/security-evidence
          retention-days: 30
          if-no-files-found: error
  verified-source:
    if: always()
    needs: [offline-source, security]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every source and security gate
        env:
          OFFLINE_RESULT: ${{ needs.offline-source.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: test "$OFFLINE_RESULT" = success && test "$SECURITY_RESULT" = success
